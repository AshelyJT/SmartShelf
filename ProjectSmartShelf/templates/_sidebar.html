{% load static %}
<nav class="sidebar p-3 d-flex flex-column h-100">
    <!-- Logo -->
    <div class="mb-4 sidebar_logo">
        <img src="{% static 'images/logo_transparent.png' %}" alt="SmartShelf Logo" class="logo">
        <div class="tagline text-light">AI-POWERED RETAIL DISPLAYS</div>
    </div>

    <div class="sidebar-nav-scroll">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'staff_dashboard' %}active{% endif %}" 
                   href="{% url 'staff_dashboard' %}">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-graph-up"></i> Reports
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'pricing_dashboard' %}active{% endif %}" 
                   href="{% url 'pricing_dashboard' %}">
                    <i class="bi bi-robot"></i> AI Pricing
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'manual_pricing' %}active{% endif %}" 
                href="{% url 'manual_pricing' %}">
                    <i class="bi bi-calculator"></i> Manual Pricing
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'promotions' %}active{% endif %}" 
                href="{% url 'promotions' %}">
                    <i class="bi bi-tags"></i> Promotions
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'inventory_management' %}active{% endif %}" 
                href="{% url 'inventory_management' %}">
                    <i class="bi bi-box-seam"></i> Inventory
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'lcd_management' %}active{% endif %}" 
                href="{% url 'lcd_management' %}">
                    <i class="bi bi-display"></i> LCD Management
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'price_history' %}active{% endif %}" 
                href="{% url 'price_history' %}">
                    <i class="bi bi-clock-history"></i> Price History
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link nav-link-with-badge {% if request.resolver_match.url_name == 'recommendations' %}active{% endif %}" 
                href="{% url 'recommendations' %}">
                    <span class="nav-link-label"><i class="bi bi-lightbulb"></i> Recommendations</span>
                    {% if recommendations_count %}
                    <span class="recommendation-badge" aria-label="{{ recommendations_count }} recommendations">{{ recommendations_count }}</span>
                    {% endif %}
                </a>
            </li>
        </ul>
    </div>
    <div class="sidebar-footer">
        <hr class="sidebar-divider">
        <form method="post" action="{% url 'staff_logout' %}" class="sidebar-logout">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger w-100">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </form>
    </div>
</nav>
