<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermarket Till Prototype</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            padding: 15px;
            min-height: 100vh;
            color: #e0e0e0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            height: calc(100vh - 30px);
        }

        .products-grid {
            background: rgba(30, 30, 50, 0.8);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            height: 100%;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .products-title {
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .product-cards {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            flex: 1;
            align-content: start;
        }

        .product-card {
            background: linear-gradient(135deg, rgba(123, 44, 191, 0.6) 0%, rgba(0, 212, 255, 0.3) 100%);
            color: white;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(123, 44, 191, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.6s;
        }

        .product-card:hover::before {
            left: 100%;
        }

        .product-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 16px 48px rgba(123, 44, 191, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.4);
        }

        .product-name {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .product-price {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .receipt-section {
            display: flex;
            flex-direction: column;
            background: rgba(30, 30, 50, 0.8);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-height: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .receipt-section h2 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 18px;
            color: #ffffff;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .current-transaction {
            background: linear-gradient(135deg, rgba(123, 44, 191, 0.15) 0%, rgba(0, 212, 255, 0.08) 100%);
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1.5px solid rgba(0, 212, 255, 0.2);
            color: #e0e0e0;
            line-height: 1.8;
        }

        .current-transaction strong {
            color: #00d4ff;
            font-weight: 700;
        }

        .total-display {
            font-size: 24px;
            font-weight: 800;
            color: white;
            text-align: center;
            margin: 16px 0;
            padding: 20px;
            background: linear-gradient(135deg, rgba(123, 44, 191, 0.8) 0%, rgba(0, 212, 255, 0.5) 100%);
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(123, 44, 191, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .process-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.15);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .process-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .process-btn:hover::before {
            left: 100%;
        }

        .process-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 48px rgba(0, 212, 255, 0.45);
        }

        .process-btn:disabled {
            background: linear-gradient(135deg, #555 0%, #333 100%);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 12, 41, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: rgba(30, 30, 50, 0.95);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 16px;
            width: 320px;
            max-width: 85vw;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h3 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 15px;
            color: #ffffff;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-content p {
            font-size: 14px;
            color: #a0a0b0;
            margin: 8px 0;
            font-weight: 500;
        }

        .number-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .number-btn {
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, rgba(123, 44, 191, 0.3) 0%, rgba(0, 212, 255, 0.1) 100%);
            border: 2px solid rgba(0, 212, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            color: #e0e0e0;
        }

        .number-btn:hover {
            background: linear-gradient(135deg, #7b2cbf 0%, #00d4ff 100%);
            color: white;
            border-color: transparent;
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 8px 24px rgba(123, 44, 191, 0.4);
        }

        .number-btn:active {
            transform: scale(0.95);
        }

        .quantity-display {
            font-size: 32px;
            font-weight: 900;
            margin: 18px 0;
            padding: 16px;
            background: linear-gradient(135deg, rgba(123, 44, 191, 0.2) 0%, rgba(0, 212, 255, 0.1) 100%);
            border-radius: 12px;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00d4ff;
            border: 2px solid rgba(0, 212, 255, 0.3);
            letter-spacing: 2px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .modal-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .modal-btn:hover::before {
            left: 100%;
        }

        .cancel-btn {
            background: linear-gradient(135deg, rgba(255, 69, 0, 0.3) 0%, rgba(220, 20, 60, 0.2) 100%);
            color: #ff6b6b;
            border: 2px solid #ff6b6b;
        }

        .cancel-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff4757 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 107, 107, 0.4);
            border-color: transparent;
        }

        .enter-btn {
            background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .enter-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 212, 255, 0.45);
        }

        .enter-btn:disabled {
            background: linear-gradient(135deg, #555 0%, #333 100%);
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #555;
        }

        .modal-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .recent-transactions {
            flex: 1;
            overflow-y: auto;
            max-height: 400px;
        }

        .transaction-item {
            padding: 14px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s ease;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.05), transparent);
        }

        .transaction-item:hover {
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.1), transparent);
            transform: translateX(4px);
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .transaction-item strong {
            color: #00d4ff;
            font-weight: 700;
        }

        .transaction-time {
            color: #808090;
            font-size: 12px;
            margin-top: 6px;
            font-weight: 500;
        }

        .transaction-item div:last-child {
            font-weight: 800;
            font-size: 14px;
            color: #00d4ff;
        }

        /* Scrollbar styling */
        .recent-transactions::-webkit-scrollbar {
            width: 8px;
        }

        .recent-transactions::-webkit-scrollbar-track {
            background: rgba(0, 212, 255, 0.05);
            border-radius: 10px;
        }

        .recent-transactions::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .recent-transactions::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #00b8d4 0%, #6a1fb4 100%);
        }

        @media (max-width: 1024px) {
            .product-cards {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .product-cards {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .modal-content {
                width: 80%;
                max-width: 350px;
            }
        }

        @media (max-width: 480px) {
            .product-cards {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .modal-content {
                width: 90%;
                padding: 20px 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="products-grid">
            <h2 class="products-title">🛒 Checkout System</h2>
            <div id="result" style="color: #ff6b6b; text-align: center; margin-bottom: 15px; font-weight: 600;"></div>
            <div class="product-cards" id="product-cards">
                <!-- Products will be loaded here -->
            </div>

            <div class="current-transaction" id="current-transaction">
                <p>No transaction in progress</p>
            </div>

            <div class="total-display" id="total-display">
                Total: $0.00
            </div>

            <button class="process-btn" id="process-btn" disabled>
                PROCESS TRANSACTION
            </button>
        </div>

        <div class="receipt-section">
            <h2>Recent Transactions</h2>
            <div class="recent-transactions" id="recent-transactions">
                <!-- Recent transactions will appear here -->
            </div>
        </div>
    </div>

    <!-- Quantity Entry Modal -->
    <div class="modal" id="quantity-modal">
        <div class="modal-content">
            <h3>Enter Quantity</h3>
            <p id="selected-product">Product: </p>
            <p id="selected-price">Price: </p>

            <div class="quantity-display" id="quantity-display">1</div>

            <div class="number-pad">
                <button class="number-btn" data-number="1">1</button>
                <button class="number-btn" data-number="2">2</button>
                <button class="number-btn" data-number="3">3</button>
                <button class="number-btn" data-number="4">4</button>
                <button class="number-btn" data-number="5">5</button>
                <button class="number-btn" data-number="6">6</button>
                <button class="number-btn" data-number="7">7</button>
                <button class="number-btn" data-number="8">8</button>
                <button class="number-btn" data-number="9">9</button>
                <button class="number-btn" data-number="0">0</button>
                <button class="number-btn" id="clear-btn">C</button>
                <button class="number-btn" id="backspace-btn">⌫</button>
            </div>

            <div class="modal-buttons">
                <button class="modal-btn cancel-btn" id="cancel-btn">Cancel</button>
                <button class="modal-btn enter-btn" id="enter-btn">Enter</button>
            </div>
        </div>
    </div>

    <script>
        class TillSystem {
            constructor() {
                this.currentProduct = null;
                this.currentQuantity = 0; // Start with 0
                this.baseUrl = '/checkout/';
                this.initialize();
            }

            initialize() {
                this.loadProducts();
                this.bindEvents();
                this.loadRecentTransactions();
            }

            setResultMessage(message) {
                const resultEl = document.getElementById('result');
                if (resultEl) {
                    resultEl.innerHTML = message;
                }
            }

            async loadProducts() {
                try {
                    const response = await fetch(this.baseUrl + 'get-products/');
                    const data = await response.json();

                    if (data.success) {
                        this.displayProducts(data.products);
                        this.setResultMessage(''); // Clear any previous errors
                    }
                } catch (error) {
                    console.error('Error loading products:', error);
                    this.setResultMessage('Error loading products: ' + error);
                }
            }

            displayProducts(products) {
                const container = document.getElementById('product-cards');
                container.innerHTML = '';

                products.forEach(product => {
                    const productCard = document.createElement('div');
                    productCard.className = 'product-card';
                    
                    // If inventory is zero, style it as disabled
                    if (product.inventory <= 0) {
                        productCard.classList.add('out-of-stock');
                        productCard.style.pointerEvents = 'none';
                        productCard.style.opacity = '0.5';
                        productCard.style.cursor = 'not-allowed';
                    }
                    
                    productCard.dataset.id = product.id;
                    productCard.innerHTML = `
                        <div class="product-name">${product.name}</div>
                        <div class="product-category">${product.category}</div>
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                        <div class="product-inventory">Stock: ${product.inventory}</div>
                    `;
                    
                    // Only allow click if inventory > 0
                    productCard.addEventListener('click', () => {
                        if (product.inventory > 0) {
                            this.selectProduct(product);
                        } else {
                            alert('Out of stock!');
                        }
                    });
                    
                    container.appendChild(productCard);
                });
            }

            selectProduct(product) {
                if (product.inventory <= 0) {
                    alert('Out of stock!');
                    return;
                }
                this.currentProduct = product;
                this.currentQuantity = 0; // start with 0
                this.showQuantityModal();
            }

            showQuantityModal() {
                if (!this.currentProduct) return;

                document.getElementById('selected-product').textContent =
                    `Product: ${this.currentProduct.name}`;
                document.getElementById('selected-price').textContent =
                    `Price: $${this.currentProduct.price.toFixed(2)}`;

                // Reset to 0 and disable Enter button
                this.currentQuantity = 0;
                document.getElementById('quantity-display').textContent = '0';
                document.getElementById('enter-btn').disabled = true;
                document.getElementById('enter-btn').style.opacity = '0.6';

                const modal = document.getElementById('quantity-modal');
                modal.style.display = 'flex';

                // Focus on modal for keyboard input
                setTimeout(() => {
                    document.getElementById('quantity-display').focus();
                }, 100);
            }

            hideQuantityModal() {
                const modal = document.getElementById('quantity-modal');
                modal.style.display = 'none';
            }

            updateQuantityDisplay() {
                // Update the quantity display in modal
                document.getElementById('quantity-display').textContent = this.currentQuantity;

                // Enable/disable Enter button based on quantity
                const enterBtn = document.getElementById('enter-btn');
                if (this.currentQuantity > 0) {
                    enterBtn.disabled = false;
                    enterBtn.style.opacity = '1';
                } else {
                    enterBtn.disabled = true;
                    enterBtn.style.opacity = '0.6';
                }

                // If we're closing the modal (after pressing Enter), update the main display
                if (this.currentQuantity > 0) {
                    const transactionDiv = document.getElementById('current-transaction');
                    const subtotal = this.currentProduct.price * this.currentQuantity;

                    transactionDiv.innerHTML = `
                    <strong>Current Transaction:</strong><br>
                    ${this.currentProduct.name} x${this.currentQuantity}<br>
                    Unit Price: $${this.currentProduct.price.toFixed(2)}<br>
                    Subtotal: $${subtotal.toFixed(2)}
                `;

                    // Update total display
                    document.getElementById('total-display').textContent =
                        `Total: $${subtotal.toFixed(2)}`;

                    // Enable process button
                    document.getElementById('process-btn').disabled = false;
                }
            }

            async processTransaction() {
                if (!this.currentProduct || !this.currentQuantity || this.currentQuantity < 1) {
                    alert('Please select a product and enter a valid quantity');
                    return;
                }

                try {
                    const response = await fetch(this.baseUrl + 'process-transaction/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': this.getCSRFToken()
                        },
                        body: JSON.stringify({
                            product_id: this.currentProduct.id,
                            quantity: this.currentQuantity
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        alert(`Transaction successful!\nTotal: $${data.transaction.total.toFixed(2)}`);

                        // Reset the till interface
                        this.resetInterface();

                        // Reload products to update stock counts (real-time update)
                        await this.loadProducts();

                        // Reload recent transactions
                        this.loadRecentTransactions();
                        
                        this.setResultMessage(''); // Clear any previous errors
                    } else {
                        this.setResultMessage('Error: ' + data.error);
                    }
                } catch (error) {
                    console.error('Error processing transaction:', error);
                    document.getElementById('result').innerHTML =
                        'Network error: ' + error.message;
                }
            }

            resetInterface() {
                this.currentProduct = null;
                this.currentQuantity = 0;

                document.getElementById('current-transaction').innerHTML =
                    '<p>No transaction in progress</p>';
                document.getElementById('total-display').textContent = 'Total: $0.00';
                document.getElementById('process-btn').disabled = true;
                this.setResultMessage(''); // Clear any errors

                this.hideQuantityModal();
            }

            async loadRecentTransactions() {
                try {
                    const response = await fetch(this.baseUrl + 'recent-transactions/');
                    const data = await response.json();

                    if (data.success) {
                        this.displayRecentTransactions(data.transactions);
                        this.setResultMessage(''); // Clear any previous errors
                    }
                } catch (error) {
                    console.error('Error loading recent transactions:', error);
                    this.setResultMessage('Error loading recent transactions: ' + error.message);
                }
            }

            displayRecentTransactions(transactions) {
                const container = document.getElementById('recent-transactions');
                container.innerHTML = '';

                transactions.forEach(transaction => {
                    const transactionDiv = document.createElement('div');
                    transactionDiv.className = 'transaction-item';
                    transactionDiv.innerHTML = `
                    <div>
                        <strong>${transaction.product}</strong><br>
                        <span>${transaction.quantity} × $${transaction.unit_price.toFixed(2)}</span>
                        <div class="transaction-time">${transaction.time}</div>
                    </div>
                    <div style="font-weight: bold;">
                        $${transaction.total.toFixed(2)}
                    </div>
                `;
                    container.appendChild(transactionDiv);
                });
            }

            bindEvents() {
                // Number pad buttons
                document.querySelectorAll('.number-btn[data-number]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const number = e.target.dataset.number;
                        const displayElement = document.getElementById('quantity-display');

                        // If current value is "0", replace it with the number
                        if (displayElement.textContent === '0') {
                            displayElement.textContent = number;
                            this.currentQuantity = parseInt(number);
                        } else {
                            // Otherwise, append the number
                            displayElement.textContent = displayElement.textContent + number;
                            this.currentQuantity = parseInt(displayElement.textContent);
                        }

                        // Update Enter button state
                        this.updateEnterButtonState();
                    });
                });

                // Clear button
                document.getElementById('clear-btn').addEventListener('click', () => {
                    this.currentQuantity = 0;
                    document.getElementById('quantity-display').textContent = '0';
                    this.updateEnterButtonState();
                });

                // Backspace button
                document.getElementById('backspace-btn').addEventListener('click', () => {
                    const displayElement = document.getElementById('quantity-display');
                    if (displayElement.textContent.length > 1) {
                        const newValue = displayElement.textContent.slice(0, -1);
                        displayElement.textContent = newValue;
                        this.currentQuantity = parseInt(newValue);
                    } else {
                        this.currentQuantity = 0;
                        displayElement.textContent = '0';
                    }
                    this.updateEnterButtonState();
                });

                // Update Enter button state helper
                this.updateEnterButtonState = () => {
                    const enterBtn = document.getElementById('enter-btn');
                    if (this.currentQuantity > 0) {
                        enterBtn.disabled = false;
                        enterBtn.style.opacity = '1';
                    } else {
                        enterBtn.disabled = true;
                        enterBtn.style.opacity = '0.6';
                    }
                };

                // Modal buttons
                document.getElementById('cancel-btn').addEventListener('click', () => {
                    this.hideQuantityModal();
                    this.resetInterface();
                });

                document.getElementById('enter-btn').addEventListener('click', () => {
                    if (this.currentQuantity > 0) {
                        this.hideQuantityModal();
                        this.updateQuantityDisplay(); // This will update the main display
                    }
                });

                // Process button
                document.getElementById('process-btn').addEventListener('click', () => {
                    this.processTransaction();
                });

                // Close modal when clicking outside
                document.getElementById('quantity-modal').addEventListener('click', (e) => {
                    if (e.target.id === 'quantity-modal') {
                        this.hideQuantityModal();
                        this.resetInterface();
                    }
                });

                // Keyboard support for number pad
                document.addEventListener('keydown', (e) => {
                    const modal = document.getElementById('quantity-modal');
                    if (modal.style.display === 'flex') {
                        // Handle number keys
                        if (e.key >= '0' && e.key <= '9') {
                            e.preventDefault();
                            const displayElement = document.getElementById('quantity-display');

                            // If current value is "0", replace it
                            if (displayElement.textContent === '0') {
                                displayElement.textContent = e.key;
                                this.currentQuantity = parseInt(e.key);
                            } else {
                                // Otherwise, append
                                displayElement.textContent = displayElement.textContent + e.key;
                                this.currentQuantity = parseInt(displayElement.textContent);
                            }
                            this.updateEnterButtonState();
                        }
                        // Handle Enter key
                        else if (e.key === 'Enter') {
                            e.preventDefault();
                            if (this.currentQuantity > 0) {
                                document.getElementById('enter-btn').click();
                            }
                        }
                        // Handle Escape key
                        else if (e.key === 'Escape') {
                            e.preventDefault();
                            document.getElementById('cancel-btn').click();
                        }
                        // Handle Backspace key
                        else if (e.key === 'Backspace') {
                            e.preventDefault();
                            document.getElementById('backspace-btn').click();
                        }
                        // Handle Delete key
                        else if (e.key === 'Delete') {
                            e.preventDefault();
                            document.getElementById('clear-btn').click();
                        }
                    }
                });

                // Click handler for Enter button to prevent default when disabled
                document.getElementById('enter-btn').addEventListener('click', (e) => {
                    if (e.target.disabled) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                });
            }

            getCSRFToken() {
                const name = 'csrftoken';
                let cookieValue = null;
                if (document.cookie && document.cookie !== '') {
                    const cookies = document.cookie.split(';');
                    for (let i = 0; i < cookies.length; i++) {
                        const cookie = cookies[i].trim();
                        if (cookie.substring(0, name.length + 1) === (name + '=')) {
                            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                            break;
                        }
                    }
                }
                return cookieValue;
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            window.till = new TillSystem();
        });
    </script>
